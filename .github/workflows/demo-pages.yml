name: Legacy Pages Redirect

# The demo and the docs moved out of this repository: the frozen 1.x demo is at
# https://cpamp-demo.seakee.dev/, the docs at https://cpamp-docs.seakee.dev/.
# This workflow keeps the old project Pages URLs working by publishing the small
# static redirect site committed in bin/pages-redirect/.
#
# The job name is "build" on purpose: branch protection on main records it, and
# renaming it would leave an inherited required check waiting forever.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Legacy Redirect Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'

      - name: Verify committed redirect site
        run: |
          set -euo pipefail
          node bin/pages-redirect/build.mjs
          git diff --exit-code -- bin/pages-redirect

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bin/pages-redirect

  deploy:
    name: Deploy Legacy Redirect Site
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
