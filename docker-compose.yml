services:
  cpa-manager-plus:
    build:
      context: .
      dockerfile: Dockerfile
      # Switch the default target to slim when runtime CPA acquisition lands.
      target: full
      # The image fails closed unless VERSION and a 40-hex SOURCE_COMMIT are
      # supplied. Local builds must export SOURCE_COMMIT="$(git rev-parse HEAD)".
      args:
        VERSION: '${VERSION:-dev}'
        SOURCE_COMMIT: '${SOURCE_COMMIT:-}'
    image: seakee/cpa-manager-plus:latest
    restart: unless-stopped
    stop_grace_period: 120s
    ports:
      - '${CPAMP_PUBLIC_PORT:-18317}:18317'
    environment:
      # Explicit externally reachable origin used for real public-entry verification.
      CPAMP_PUBLIC_ORIGIN: '${CPAMP_PUBLIC_ORIGIN:-}'
      CPAMP_DRAIN_TIMEOUT: '${CPAMP_DRAIN_TIMEOUT:-90s}'
      USAGE_COLLECTOR_MODE: 'auto'
      USAGE_RESP_QUEUE: 'usage'
      USAGE_RESP_POP_SIDE: 'right'
      USAGE_BATCH_SIZE: '100'
      USAGE_POLL_INTERVAL_MS: '500'
      USAGE_QUERY_LIMIT: '50000'
      USAGE_CORS_ORIGINS: '*'
    volumes:
      - cpamp-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:18317/health']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  cpamp-data:
