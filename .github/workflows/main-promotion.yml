name: PR Target Policy

on:
  pull_request:
    branches:
      - main
      - v2
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  pull_request_target:
    branches-ignore:
      - dev
      - v2
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  retarget:
    name: Retarget pull request to dev
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref != 'dev' &&
      github.event.pull_request.base.ref != 'v2' &&
      (github.event.pull_request.base.ref != 'main' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.ref != 'dev')
    runs-on: ubuntu-latest
    steps:
      - name: Verify retargeting credentials
        env:
          APP_ID: ${{ vars.PR_TARGET_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PR_TARGET_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_ID}" ]; then
            echo "Repository variable PR_TARGET_APP_ID is required to retarget pull requests." >&2
            exit 1
          fi

          if [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "Repository secret PR_TARGET_PRIVATE_KEY is required to retarget pull requests." >&2
            exit 1
          fi

      - name: Create pull request retargeting token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_TARGET_APP_ID }}
          private-key: ${{ secrets.PR_TARGET_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Retarget pull request to dev
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const repository = `${owner}/${repo}`;

            const { data: current } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const targetsDev = current.base.ref === "dev";
            const targetsV2 = current.base.ref === "v2";
            const isDevPromotion =
              current.base.ref === "main" &&
              current.head.repo?.full_name === repository &&
              current.head.ref === "dev";

            if (targetsDev || targetsV2 || isDevPromotion) {
              core.info("Pull request target already satisfies the integration policy.");
              return;
            }

            const previousBase = current.base.ref;
            const { data: updated } = await github.rest.pulls.update({
              owner,
              repo,
              pull_number,
              base: "dev"
            });

            if (updated.base.ref !== "dev") {
              core.setFailed(`Expected pull request base dev, received ${updated.base.ref}.`);
              return;
            }

            core.notice(`Retargeted pull request #${pull_number} from ${previousBase} to dev.`);

  verify-source:
    name: Verify dev promotion source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Verify protected target source policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${BASE_REF}" = "v2" ]; then
            echo "v2 is an allowed development target."
            exit 0
          fi

          if [ "${BASE_REF}" != "main" ]; then
            echo "Expected a pull request targeting main or v2, got ${BASE_REF}." >&2
            exit 1
          fi

          if [ "${HEAD_REPOSITORY}" != "${REPOSITORY}" ] || [ "${HEAD_REF}" != "dev" ]; then
            echo "main accepts promotions only from ${REPOSITORY}:dev." >&2
            echo "Received ${HEAD_REPOSITORY}:${HEAD_REF}." >&2
            exit 1
          fi
