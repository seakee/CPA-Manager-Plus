name: Publish verified update channels
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate channels without remote writes'
        type: boolean
        default: true
        required: true
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      withdraw_release:
        type: string
        default: ''
      restore_release:
        type: string
        default: ''
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: inputs.dry_run != true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: inputs.dry_run != true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Reconcile aliases and publish index last
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          node bin/release/publish-update-index.mjs "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          WITHDRAW_RELEASE: ${{ inputs.withdraw_release }}
          RESTORE_RELEASE: ${{ inputs.restore_release }}
