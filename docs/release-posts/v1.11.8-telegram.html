🚀 <b>7 月 26 日 v1.11.8</b>

✨ <b>更新内容</b>

• 凭证健康巡检现在可在监控页面安全停止，已完成的结果和执行日志会继续保留。
• 多个 Manager Server 使用同一用量数据库时，系统会保证同一时刻只执行一项凭证健康巡检，避免重复处理。
• 服务重启或短暂 SQLite 写锁后，巡检会恢复为明确终态，监控页面不会长期显示失效的运行中任务。
• 巡检启动、轮询与取消状态会以最后一次操作为准，避免旧响应把已取消任务重新显示为运行中。

⚠️ <b>注意事项</b>

• 升级启动时会自动创建巡检租约表，无需额外配置；服务停止会中断本机正在执行的巡检，可在重启后重新发起。
