services:
  cpa-manager-plus:
    build:
      context: .
      dockerfile: Dockerfile
      target: slim
      # Fail-closed identity: local builds must export
      # SOURCE_COMMIT="$(git rev-parse HEAD)" (VERSION defaults to dev).
      args:
        VERSION: '${VERSION:-dev}'
        SOURCE_COMMIT: '${SOURCE_COMMIT:-}'
    image: seakee/cpa-manager-plus:slim
    restart: unless-stopped
    stop_grace_period: 150s
    ports:
      - "18317:18317"
    environment:
      CPAMP_PUBLIC_ORIGIN: "${CPAMP_PUBLIC_ORIGIN:-}"
      CPAMP_DRAIN_TIMEOUT: "${CPAMP_DRAIN_TIMEOUT:-90s}"
      USAGE_COLLECTOR_MODE: "auto"
      USAGE_RESP_QUEUE: "usage"
      USAGE_RESP_POP_SIDE: "right"
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "*"
    volumes:
      - cpa-manager-plus-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  cpa-manager-plus-data:
