<!doctype html>
<html lang="zh-CN" class="light" data-theme="white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CPAMP · 初始化向导</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }
      body {
        background-color: #eff2f7;
        background-image:
          radial-gradient(620px 560px at 90% 10%, rgba(122, 162, 255, 0.36) 0%, rgba(150, 186, 255, 0.24) 24%, rgba(182, 212, 255, 0.12) 48%, rgba(182, 212, 255, 0.03) 72%, transparent 92%),
          radial-gradient(540px 490px at 10% 90%, rgba(107, 197, 255, 0.34) 0%, rgba(116, 216, 238, 0.22) 24%, rgba(125, 235, 220, 0.11) 48%, rgba(125, 235, 220, 0.03) 72%, transparent 92%),
          linear-gradient(120deg, #f0f7ff 0%, #e7f2ff 50%, #edf7ff 100%);
      }
      html[data-theme='dark'] body {
        background-color: #0a0a0a;
        background-image:
          radial-gradient(640px 580px at 90% 10%, rgba(39, 50, 92, 0.38) 0%, rgba(33, 46, 88, 0.24) 24%, rgba(27, 42, 85, 0.12) 48%, rgba(27, 42, 85, 0.03) 72%, transparent 92%),
          radial-gradient(560px 510px at 10% 90%, rgba(15, 61, 89, 0.34) 0%, rgba(13, 68, 84, 0.21) 24%, rgba(12, 74, 79, 0.1) 48%, rgba(12, 74, 79, 0.03) 72%, transparent 92%),
          linear-gradient(120deg, #0b1324 0%, #0a1426 50%, #091521 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      __CPAMP_CSP_NONCE__ is a build-time literal. The Manager replaces every
      occurrence with the per-response CSP nonce before serving this document
      and fails closed (script-src 'none') when any script tag lacks a nonce.
      Every script tag here must carry the attribute.
    -->
    <script id="cpamp-routing-context" type="application/json" nonce="__CPAMP_CSP_NONCE__">
      __CPAMP_ROUTING_CONTEXT__
    </script>
    <script nonce="__CPAMP_CSP_NONCE__">
      (function () {
        try {
          var isBootstrap = window.location.pathname === '/.well-known/cpamp-bootstrap/ui';
          if (!isBootstrap) {
            var carrier = document.getElementById('cpamp-routing-context');
            var raw = carrier ? (carrier.textContent || '').trim() : '';
            if (raw && raw !== '__CPAMP_ROUTING_CONTEXT__') {
              var ctx = JSON.parse(raw);
              if (ctx && (ctx.bootstrap || (ctx.state && ctx.state !== 'verified_effective'))) {
                isBootstrap = true;
              }
            }
          }
          var pref = 'auto';
          if (!isBootstrap) {
            var stored = window.localStorage && window.localStorage.getItem('cli-proxy-theme');
            if (stored) {
              if (stored.charAt(0) === '{') {
                var parsed = JSON.parse(stored);
                if (parsed && parsed.state && typeof parsed.state.theme === 'string') {
                  pref = parsed.state.theme;
                }
              } else {
                pref = stored;
              }
            }
          }
          var dark =
            pref === 'dark' ||
            (pref !== 'white' &&
              pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('light', !dark);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'white');
          var ve = 'full';
          if (!isBootstrap && window.localStorage) {
            var storedVe = window.localStorage.getItem('cli-proxy-visual-effects');
            if (storedVe) {
              if (storedVe.charAt(0) === '{') {
                var parsedVe = JSON.parse(storedVe);
                if (parsedVe && parsedVe.state && parsedVe.state.mode === 'reduced') {
                  ve = 'reduced';
                }
              } else if (storedVe === 'reduced') {
                ve = 'reduced';
              }
            }
          }
          document.documentElement.setAttribute('data-visual-effects', ve);
        } catch (_e) {}
      })();
    </script>
    <script type="module" src="../src/fullweb/main.tsx" nonce="__CPAMP_CSP_NONCE__"></script>
  </body>
</html>
