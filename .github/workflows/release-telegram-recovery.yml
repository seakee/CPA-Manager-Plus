name: Recover Telegram Release Notification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag whose Telegram notification needs recovery'
        required: true
        type: string
      confirm_resend:
        description: 'I verified that another Telegram message may be sent for this release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-telegram-recovery-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  notify:
    name: Recover Telegram notification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.version }}

    steps:
      - name: Require explicit resend confirmation
        shell: bash
        env:
          CONFIRM_RESEND: ${{ inputs.confirm_resend }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM_RESEND}" != "true" ]; then
            echo "Telegram recovery requires explicit resend confirmation." >&2
            exit 1
          fi
          if [ "${EVENT_REF}" != "refs/heads/main" ]; then
            echo "Telegram recovery must be dispatched from main; received ${EVENT_REF}." >&2
            exit 1
          fi

      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'

      - name: Resolve immutable release source
        id: release_source
        shell: bash
        run: |
          set -euo pipefail

          prerelease="$(node --input-type=module - "${RELEASE_TAG}" <<'NODE'
          import { parseReleaseTag } from './bin/release/validate-release.mjs';

          try {
            process.stdout.write(String(parseReleaseTag(process.argv[2]).prerelease));
          } catch (error) {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          }
          NODE
          )"

          release_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          release_body="${RUNNER_TEMP}/${RELEASE_TAG}-release-notes.md"
          release_post="${RUNNER_TEMP}/${RELEASE_TAG}-telegram.html"
          git show "${release_sha}:docs/release-notes/${RELEASE_TAG}-zh.md" > "${release_body}"
          git show "${release_sha}:docs/release-posts/${RELEASE_TAG}-telegram.html" > "${release_post}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "release_body=${release_body}" >> "${GITHUB_OUTPUT}"
          echo "release_post=${release_post}" >> "${GITHUB_OUTPUT}"

      - name: Fetch protected branch refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev

      - name: Validate tagged release provenance
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          set -euo pipefail

          release_dev_sha="$(git rev-parse --verify "${RELEASE_SHA}^2")"
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "Tagged release ${RELEASE_SHA} is no longer contained in origin/main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${release_dev_sha}" origin/dev; then
            echo "Tagged release dev commit ${release_dev_sha} is no longer contained in origin/dev." >&2
            exit 1
          fi

          for release_path in \
            "docs/release-notes/${RELEASE_TAG}-zh.md" \
            "docs/release-notes/${RELEASE_TAG}-en.md" \
            "docs/release-posts/${RELEASE_TAG}-telegram.html"; do
            if ! git diff --quiet "${RELEASE_SHA}" -- "${release_path}"; then
              echo "Current main differs from the tagged release content at ${release_path}." >&2
              exit 1
            fi
          done

          npm run --silent release:validate -- \
            --tag "${RELEASE_TAG}" \
            --sha "${RELEASE_SHA}" \
            --main-ref "${RELEASE_SHA}" \
            --dev-ref "${release_dev_sha}"

      - name: Require an existing published GitHub Release
        shell: bash
        env:
          EXPECTED_PRERELEASE: ${{ steps.release_source.outputs.prerelease }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.release_source.outputs.release_body }}
        run: |
          set -euo pipefail

          release_json="${RUNNER_TEMP}/release.json"
          http_code="$(curl \
            --silent \
            --show-error \
            --output "${release_json}" \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [ "${http_code}" != "200" ]; then
            echo "GitHub Release ${RELEASE_TAG} is not available for notification recovery (HTTP ${http_code})." >&2
            exit 1
          fi

          node bin/release/verify-published-release.mjs \
            --mode metadata \
            --tag "${RELEASE_TAG}" \
            --body-path "${RELEASE_BODY}" \
            --release-json "${release_json}" \
            --prerelease "${EXPECTED_PRERELEASE}"

      - name: Send Telegram release notification
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          RELEASE_POST_PATH: ${{ steps.release_source.outputs.release_post }}
          TELEGRAM_STRICT: 'true'
        run: bash bin/release/send-telegram-release.sh
