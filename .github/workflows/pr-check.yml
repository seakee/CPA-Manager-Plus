name: PR Check

on:
  pull_request:
    branches:
      - main
      - dev
      - v2
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - main
      - dev
      - v2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Scope
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      manager_server: ${{ steps.classify.outputs.manager_server }}
      runtime_supervisor: ${{ steps.classify.outputs.runtime_supervisor }}
      ingress: ${{ steps.classify.outputs.ingress }}
      windows_sqlite: ${{ steps.classify.outputs.windows_sqlite }}
      windows_preflight: ${{ steps.classify.outputs.windows_preflight }}
      bundle_boundary: ${{ steps.classify.outputs.bundle_boundary }}
      manager_runtime: ${{ steps.classify.outputs.manager_runtime }}
      runtime_lifecycle: ${{ steps.classify.outputs.runtime_lifecycle }}
      native_control: ${{ steps.classify.outputs.native_control }}
      docker: ${{ steps.classify.outputs.docker }}
      demo_docs: ${{ steps.classify.outputs.demo_docs }}
      release_content: ${{ steps.classify.outputs.release_content }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/pr-check-changed-files.bin"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --no-renames -z "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "${changed_files}"
          elif [ -z "${PUSH_BEFORE_SHA}" ] || [[ "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
            git show --pretty=format: --name-only --no-renames -z "${CURRENT_SHA}" > "${changed_files}"
          else
            git diff --name-only --no-renames -z "${PUSH_BEFORE_SHA}..${CURRENT_SHA}" > "${changed_files}"
          fi

          echo "Changed files:"
          while IFS= read -r -d '' file_path; do
            printf -- '- %q\n' "${file_path}"
          done < "${changed_files}"
          node bin/ci/classify-pr-checks.mjs --null < "${changed_files}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm --workspace apps/web run build:bundle
        env:
          VERSION: ci

      - name: Check demo isolation
        run: npm run check:demo-isolation

  manager-server:
    name: Manager Server
    needs: changes
    if: needs.changes.outputs.manager_server == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/manager-server/go.sum

      - name: Test
        working-directory: apps/manager-server
        run: go test ./...

      - name: Race test Bootstrap contract
        working-directory: apps/manager-server
        run: go test -race ./internal/domain/bootstrap

      - name: Race test Fresh admission and authentication cutover
        working-directory: apps/manager-server
        run: go test -race ./cmd/cpa-manager-plus ./internal/processlock ./internal/repository/freshstore ./internal/service/fresh ./internal/service/freshrouting ./internal/service/freshstrategy ./internal/http/controller/freshbootstrap

      - name: Race test Runtime ownership paths
        if: needs.changes.outputs.manager_runtime == 'true'
        working-directory: apps/manager-server
        run: go test -race ./internal/service/cpaupdate ./internal/service/runtime ./internal/repository/setting ./internal/service/bootstrap

      - name: Vet
        working-directory: apps/manager-server
        run: go vet ./...

      - name: Verify Fresh adoption with exact CPA v8 and Supervisor
        if: needs.changes.outputs.manager_runtime == 'true'
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/fresh-adoption-v8"
          tools="${RUNNER_TEMP}/fresh-adoption-tools"
          mkdir -p "${evidence}" "${tools}/v8" "${tools}/v7"
          curl --fail --location --max-time 120 --output "${tools}/v8/cpa.tar.gz" \
            https://github.com/router-for-me/CLIProxyAPI/releases/download/v8.0.13/CLIProxyAPI_8.0.13_linux_amd64.tar.gz
          printf '%s  %s\n' 50ecffb47fdd81c8c5a9825a73a7a905ab66342337e274f39c4276b92d3533f3 "${tools}/v8/cpa.tar.gz" | sha256sum --check --status
          tar -xzf "${tools}/v8/cpa.tar.gz" -C "${tools}/v8" cli-proxy-api
          printf '%s  %s\n' b682e9e42586263f476888361514f68f89ff4ebf89a5dadba394b850b797ce41 "${tools}/v8/cli-proxy-api" | sha256sum --check --status

          curl --fail --location --max-time 120 --output "${tools}/v7/cpa.tar.gz" \
            https://github.com/router-for-me/CLIProxyAPI/releases/download/v7.0.12/CLIProxyAPI_7.0.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8afc9ed4c89a50a5ffce5d122a9bb93442c5b8ff3d8c6f07b7a274c719109b74 "${tools}/v7/cpa.tar.gz" | sha256sum --check --status
          tar -xzf "${tools}/v7/cpa.tar.gz" -C "${tools}/v7" cli-proxy-api

          go -C apps/runtime-supervisor build -trimpath -o "${tools}/cpamp-runtime-supervisor" ./cmd/cpamp-runtime-supervisor
          export CPAMP_TEST_CPA_V8="${tools}/v8/cli-proxy-api"
          export CPAMP_TEST_CPA_LEGACY="${tools}/v7/cli-proxy-api"
          export CPAMP_TEST_RUNTIME="${tools}/cpamp-runtime-supervisor"
          export CPAMP_TEST_CPA_LEGACY_ARCHIVE_SHA256="8afc9ed4c89a50a5ffce5d122a9bb93442c5b8ff3d8c6f07b7a274c719109b74"
          export CPAMP_TEST_FRESH_TRANSITION_OUT="${evidence}/fresh-legacy-transition.json"
          export CPAMP_TEST_FRESH_TRANSITION_HEAD="$(git rev-parse HEAD)"
          export CPAMP_TEST_FRESH_TRANSITION_TREE="$(git rev-parse HEAD^{tree})"
          export CPAMP_TEST_FRESH_TRANSITION_SOURCE_HEAD="${SOURCE_HEAD}"
          export CPAMP_TEST_FRESH_RESOURCE_OUT_DIR="${evidence}"
          go -C apps/runtime-supervisor test -race -count=1 -json -run '^TestDestinationRealCPAV8$' ./internal/lifecycle | tee "${evidence}/supervisor.jsonl"
          go -C apps/manager-server test -race -count=1 -json -run '^TestAdoptionExactCPAV8WithSupervisor$' ./internal/service/freshstrategy | tee "${evidence}/adoption.jsonl"
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          evidence = os.path.join(os.environ['RUNNER_TEMP'],'fresh-adoption-v8')
          def sha(name):
              with open(os.path.join(evidence, name), 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          manifest_sha = sha('fresh-legacy-transition-manifest.json')
          report_sha = sha('fresh-legacy-transition-report.json')
          observation_sha = sha('fresh-legacy-transition.json')
          with open(os.path.join(evidence, 'fresh-legacy-transition-report.json')) as f:
              report = json.load(f)
          with open(os.path.join(evidence, 'fresh-legacy-transition-authority.json')) as f:
              authority = json.load(f)
          tested_commit = output('git','rev-parse','HEAD')
          tested_tree = output('git','rev-parse','HEAD^{tree}')
          target_archive = '50ecffb47fdd81c8c5a9825a73a7a905ab66342337e274f39c4276b92d3533f3'
          target_binary = 'b682e9e42586263f476888361514f68f89ff4ebf89a5dadba394b850b797ce41'
          legacy_archive = os.environ['CPAMP_TEST_CPA_LEGACY_ARCHIVE_SHA256']
          legacy_binary = output('sha256sum', os.environ['CPAMP_TEST_CPA_LEGACY']).split()[0]
          if report['manifestSha256'] != manifest_sha or report['evidence'][0]['sha256'] != observation_sha or report['run']['runnerCommit'] != tested_commit or report['run'].get('testedTree') != tested_tree:
              raise SystemExit('transition report does not bind the emitted manifest/observation/head/tree')
          if authority['manifest']['sha256'] != manifest_sha or authority['report']['sha256'] != report_sha or authority['observation']['sha256'] != observation_sha:
              raise SystemExit('transition authority digest mismatch')
          with open(os.path.join(evidence, 'fresh-legacy-transition.json')) as f:
              transition = json.load(f)
          transition_digest = transition['consumerImplementationSha256']
          def verify_resource(short, expected_class):
              base = 'fresh-adoption-resource-' + short
              names = {role: base + '-' + role + '.json' for role in ('manifest','report','read','replay','verify')}
              shas = {role: sha(name) for role, name in names.items()}
              with open(os.path.join(evidence, names['manifest'])) as f:
                  manifest = json.load(f)
              with open(os.path.join(evidence, names['report'])) as f:
                  resource_report = json.load(f)
              with open(os.path.join(evidence, base + '-authority.json')) as f:
                  resource_authority = json.load(f)
              if manifest['sourceClass'] != expected_class or manifest['candidate']['artifactId'] != 'sha256:' + target_binary or manifest['candidate']['declaredSha256'] != target_archive:
                  raise SystemExit(base + ' manifest source/target mismatch')
              if expected_class == 'network_existing':
                  if manifest.get('sourceProfile') != 'cpa_v8' or manifest.get('legacySource') is not None:
                      raise SystemExit(base + ' source profile mismatch')
              else:
                  if manifest.get('sourceProfile') not in (None, '') or manifest.get('legacySource') != {'version':'v7.0.12','archiveSha256':legacy_archive,'binarySha256':legacy_binary}:
                      raise SystemExit(base + ' source profile mismatch')
              if resource_report['manifestSha256'] != shas['manifest'] or resource_report['run']['runnerCommit'] != tested_commit or resource_report['run'].get('testedTree') != tested_tree:
                  raise SystemExit(base + ' report does not bind manifest/head/tree')
              if len(resource_report['results']) != 3 or any(r['executionState'] != 'completed' or r['assertionOutcome'] != 'pass' or r['capability'] != 'supported' for r in resource_report['results']):
                  raise SystemExit(base + ' results are not three completed supported cases')
              cases = [c['id'] for c in manifest['cases']]
              by_case = {e['id']: e['sha256'] for e in resource_report['evidence']}
              if [by_case.get(case) for case in cases] != [shas['read'], shas['replay'], shas['verify']]:
                  raise SystemExit(base + ' report evidence does not bind the three traces')
              if resource_authority['manifest']['sha256'] != shas['manifest'] or resource_authority['report']['sha256'] != shas['report'] or resource_authority['traces']['read']['sha256'] != shas['read'] or resource_authority['traces']['replay']['sha256'] != shas['replay'] or resource_authority['traces']['verify']['sha256'] != shas['verify']:
                  raise SystemExit(base + ' authority digest mismatch')
              digests = set()
              for role, case in zip(('read','replay','verify'), cases):
                  with open(os.path.join(evidence, names[role])) as f:
                      trace = json.load(f)
                  if trace['runId'] != resource_report['run']['id'] or trace['caseRef'] != case or trace['sourceClass'] != expected_class:
                      raise SystemExit(base + ' trace binding mismatch')
                  digests.add(trace['consumerImplementationSha256'])
              if len(digests) != 1 or digests.pop() != transition_digest:
                  raise SystemExit(base + ' implementation digest mismatch')
              return shas
          network_shas = verify_resource('network', 'network_existing')
          legacy_shas = verify_resource('legacy', 'legacy_managed')
          value = dict(sourceHead=os.environ['SOURCE_HEAD'], testedCommit=tested_commit,
                       testedTree=tested_tree,
                       platform=platform.platform(), goVersion=output('go','version'),
                       archiveSha256=target_archive, binarySha256=target_binary,
                       legacyVersion='v7.0.12', legacyArchiveSha256=legacy_archive, legacyBinarySha256=legacy_binary,
                       legacyTransition='live-v7-source-to-manager-owned-staging-v8',
                       legacyTransitionCaseRef='fresh-legacy-managed-stage-v8-r1',
                       transitionManifestSha256=manifest_sha, transitionReportSha256=report_sha,
                       transitionObservationSha256=observation_sha, consumerImplementationSha256=transition_digest,
                       resourceProfile='CPA8-ADOPT-RESOURCE-r1',
                       resourceNetworkManifestSha256=network_shas['manifest'], resourceNetworkReportSha256=network_shas['report'],
                       resourceNetworkReadTraceSha256=network_shas['read'], resourceNetworkReplayTraceSha256=network_shas['replay'],
                       resourceNetworkVerifyTraceSha256=network_shas['verify'],
                       resourceLegacyManifestSha256=legacy_shas['manifest'], resourceLegacyReportSha256=legacy_shas['report'],
                       resourceLegacyReadTraceSha256=legacy_shas['read'], resourceLegacyReplayTraceSha256=legacy_shas['replay'],
                       resourceLegacyVerifyTraceSha256=legacy_shas['verify'],
                       sourceClasses=['network_existing','legacy_managed'], resourceInventory='explicit-bounded-decisions',
                       migratedResource='client-api-keys', productionAcceptance='pending', gateway='pending')
          with open(os.path.join(evidence,'environment.json'),'w') as f:
              json.dump(value, f, indent=2)
          PY

      - name: Upload controlled Fresh adoption observations
        if: always() && needs.changes.outputs.manager_runtime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-adoption-v8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh-adoption-v8/
          if-no-files-found: error
          retention-days: 14

      - name: Record Linux bundle boundary environment
        if: needs.changes.outputs.bundle_boundary == 'true'
        working-directory: apps/manager-server
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/manager-bundle-linux"
          python3 - <<'PY'
          import json, os, platform, subprocess
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'manager-bundle-linux/environment.json'), 'w') as f:
              json.dump(dict(sourceHead=os.environ['SOURCE_HEAD'], testedCommit=output('git','rev-parse','HEAD'),
                             runnerOS=os.environ['RUNNER_OS'], runnerArch=os.environ['RUNNER_ARCH'],
                             kernel=platform.release(), goVersion=output('go','version'),
                             sqliteDriver=output('go','list','-m','modernc.org/sqlite')), f, indent=2)
          PY

      - name: Test bundle recovery and publication boundaries with race
        if: needs.changes.outputs.bundle_boundary == 'true'
        working-directory: apps/manager-server
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout 20m -json ./internal/service/maintenancebundle ./internal/command/managerdatabundle ./internal/processlock |
            tee "${RUNNER_TEMP}/manager-bundle-linux/boundary.jsonl"

      - name: Upload Linux bundle boundary evidence
        if: always() && needs.changes.outputs.bundle_boundary == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-bundle-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manager-bundle-linux/
          if-no-files-found: error
          retention-days: 14

  runtime-supervisor:
    name: Runtime Supervisor
    needs: changes
    if: needs.changes.outputs.runtime_supervisor == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/runtime-supervisor/go.mod

      - name: Test
        working-directory: apps/runtime-supervisor
        run: go test ./...

      - name: Test deterministic Runtime prepare and staging
        working-directory: apps/runtime-supervisor
        run: go test ./internal/update -run '^(TestSourceResolvesOnlyExactOfficialReleaseAsset|TestSourceBoundsMetadataAndArchiveAndVerifiesDigest|TestStoreStagesOnlyExactExecutableWithExactIdentity|TestStoreReusesOnlyVerifiedImmutableFinalStageAcrossReopen)$' -count=1

      - name: Race test
        working-directory: apps/runtime-supervisor
        run: go test -race ./...

      - name: Vet
        working-directory: apps/runtime-supervisor
        run: go vet ./...

      - name: Portability build
        working-directory: apps/runtime-supervisor
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64; do
            echo "Building ${target}"
            output="${RUNNER_TEMP}/cpamp-runtime-supervisor-${target%/*}-${target#*/}"
            if [ "${target%/*}" = windows ]; then output+=".exe"; fi
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o "${output}" ./cmd/cpamp-runtime-supervisor
          done

      - name: Test architecture boundary
        run: go test ./bin/ci/runtime-boundary/main.go ./bin/ci/runtime-boundary/main_test.go

      - name: Validate architecture boundary
        run: go run ./bin/ci/runtime-boundary/main.go

  runtime-supervisor-windows:
    name: Runtime Supervisor (Windows)
    needs: changes
    if: needs.changes.outputs.runtime_supervisor == 'true'
    runs-on: windows-latest
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/runtime-supervisor/go.mod

      - name: Test selection filesystem portability
        working-directory: apps/runtime-supervisor
        run: go test ./internal/selection -run '^TestSelectionStoreAcceptsPlatformNativeDirectoryPermissions$' -count=1

  ingress:
    name: Ingress
    needs: changes
    if: needs.changes.outputs.ingress == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/ingress/go.mod

      - name: Test
        working-directory: apps/ingress
        run: go test ./...

      - name: Race test
        working-directory: apps/ingress
        run: go test -race ./...

      - name: Vet
        working-directory: apps/ingress
        run: go vet ./...

      - name: Verify stdlib-only architecture boundary
        working-directory: apps/ingress
        shell: bash
        run: |
          set -euo pipefail
          modules="$(go list -mod=readonly -m all)"
          if [ "$(printf '%s\n' "${modules}" | wc -l)" -ne 1 ]; then
            printf 'Ingress must remain stdlib-only; module graph:\n%s\n' "${modules}" >&2
            exit 1
          fi

      - name: Portability build
        working-directory: apps/ingress
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64; do
            echo "Building ${target}"
            output="${RUNNER_TEMP}/cpamp-ingress-${target%/*}-${target#*/}"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o "${output}" ./cmd/cpamp-ingress
          done

  manager-server-windows-sqlite:
    name: Manager Server SQLite (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.windows_sqlite == 'true' ||
      needs.changes.outputs.windows_preflight == 'true' ||
      needs.changes.outputs.bundle_boundary == 'true' ||
      needs.changes.outputs.manager_runtime == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: apps/manager-server/go.sum

      - name: Record Windows test environment
        working-directory: apps/manager-server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/manager-preflight-windows" | Out-Null
          @{
            sourceHead = '${{ github.event.pull_request.head.sha || github.sha }}'
            testedCommit = (git rev-parse HEAD)
            runnerOS = $env:RUNNER_OS
            runnerArch = $env:RUNNER_ARCH
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            goVersion = (go version)
            sqliteDriver = (go list -m modernc.org/sqlite)
          } | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/manager-preflight-windows/environment.json"

      - name: Test SQLite repository and source inspection
        if: needs.changes.outputs.windows_sqlite == 'true'
        working-directory: apps/manager-server
        shell: pwsh
        run: |
          go test -count=1 -json ./internal/repository/sqlite ./internal/adapters/sqlite/identitystore |
            Tee-Object -FilePath "$env:RUNNER_TEMP/manager-preflight-windows/sqlite.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test preflight ownership and commands
        if: needs.changes.outputs.windows_preflight == 'true'
        working-directory: apps/manager-server
        shell: pwsh
        run: |
          go test -count=1 -json ./internal/processlock ./internal/config ./internal/service/legacypreflight ./internal/command/legacypreflight ./internal/domain/bootstrap ./internal/repository/freshstore ./internal/service/fresh ./internal/service/freshstrategy |
            Tee-Object -FilePath "$env:RUNNER_TEMP/manager-preflight-windows/preflight.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test preflight startup and recovery
        if: needs.changes.outputs.windows_preflight == 'true'
        working-directory: apps/manager-server
        shell: pwsh
        run: |
          go test -count=1 -json -run '^(TestBlockedLegacyNormalStartupHasNoSourceSideEffects|TestNativePreflightRetainsEncryptedKeyGuardsForBothSettings|TestLegacyPreflightMainDispatchReturnsBeforeServer|TestNativeV2FreshAndReopenStartup|TestFreshNoConfigNormalStartup|TestStartupPreflightTimeout|TestNativeV2CrashWALStartupReadsCommittedUsage|TestFreshInitializationFailureAllowsRetry|TestFreshProductionQualificationCannotBeGrantedByHTTPOrRestart|TestFreshCommittedStrategyReplayChecksTargetsWithoutUpdating|TestFreshCompleteRejectsMalformedStrategyCheckpoint)$' ./cmd/cpa-manager-plus |
            Tee-Object -FilePath "$env:RUNNER_TEMP/manager-preflight-windows/startup.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Runtime portability
        if: needs.changes.outputs.manager_runtime == 'true'
        working-directory: apps/manager-server
        run: go test ./internal/service/runtime ./internal/repository/setting ./internal/service/bootstrap

      - name: Test bundle runtime recovery and Windows file semantics
        if: needs.changes.outputs.bundle_boundary == 'true'
        working-directory: apps/manager-server
        shell: pwsh
        run: |
          go test -count=1 -timeout 20m -json ./internal/service/maintenancebundle ./internal/command/managerdatabundle |
            Tee-Object -FilePath "$env:RUNNER_TEMP/manager-preflight-windows/bundle-boundary.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Manager Server
        working-directory: apps/manager-server
        run: go build ./cmd/cpa-manager-plus

      - name: Upload Windows preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-preflight-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manager-preflight-windows/
          if-no-files-found: error
          retention-days: 14

  native-control:
    name: Native Control (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native_control == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test native control scripts
        run: npx vitest run tests/nativeControlScripts.test.mjs

      - name: Validate native packaging script syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n bin/release/package-native.sh

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - changes
      - frontend
      - manager-server
      - runtime-supervisor
      - ingress
    if: >-
      always() &&
      needs.changes.outputs.docker == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs['manager-server'].result == 'success' || needs['manager-server'].result == 'skipped') &&
      (needs['runtime-supervisor'].result == 'success' || needs['runtime-supervisor'].result == 'skipped') &&
      (needs.ingress.result == 'success' || needs.ingress.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate Docker Compose configurations
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --format json | node bin/ci/validate-runtime12-compose.mjs
          docker compose -f docker-compose.manager.yml config >/dev/null

      - name: Build Manager Server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager-server
          push: false
          load: true
          build-args: |
            VERSION=ci

      - name: Build Ingress images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.ingress
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build Runtime images with pinned CPA
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build native smoke images
        if: needs.changes.outputs.runtime_lifecycle == 'true'
        run: docker compose build

      - name: Run single-public-port Runtime smoke
        if: needs.changes.outputs.runtime_lifecycle == 'true'
        env:
          CPAMP_SMOKE_PORT: '18317'
          CPAMP_SMOKE_SKIP_BUILD: 'true'
        run: bin/ci/runtime12-docker-smoke.sh

      - name: Run Runtime failure-behavior E2E
        if: needs.changes.outputs.runtime_lifecycle == 'true'
        env:
          CPAMP_RUNTIME14_PORT: '18317'
          CPAMP_RUNTIME14_SKIP_BUILD: 'true'
        run: bin/ci/runtime14-failure-e2e.sh

      - name: Run Runtime activation and rollback E2E
        if: needs.changes.outputs.runtime_lifecycle == 'true'
        env:
          CPAMP_RUNTIME17_PORT: '18317'
          CPAMP_RUNTIME17_SKIP_BUILD: 'true'
        run: bin/ci/runtime17-activation-e2e.sh

      - name: Run Runtime secret and state segmentation E2E
        if: needs.changes.outputs.runtime_lifecycle == 'true'
        env:
          CPAMP_RUNTIME18_PORT: '18317'
          CPAMP_RUNTIME18_SKIP_BUILD: 'true'
        run: bin/ci/runtime18-secret-state-e2e.sh

      - name: Run Runtime Phase1 exit E2E
        if: needs.changes.outputs.runtime_lifecycle == 'true'
        env:
          CPAMP_RUNTIME19_PORT: '18317'
          CPAMP_RUNTIME19_SKIP_BUILD: 'true'
        run: bin/ci/runtime19-phase1-exit-e2e.sh

  demo-docs:
    name: Demo and Docs
    needs: changes
    if: needs.changes.outputs.demo_docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo site
        run: npm --workspace apps/web run build:demo:bundle
        env:
          VERSION: ci-demo

      - name: Build docs site
        run: npm run docs:build

  release-content:
    name: Release Content
    needs: changes
    if: needs.changes.outputs.release_content == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate changed release content
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/release-content-changed-files.bin"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --no-renames --diff-filter=A -z "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "${changed_files}"
          elif [ -z "${PUSH_BEFORE_SHA}" ] || [[ "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
            git show --pretty=format: --name-only --no-renames --diff-filter=A -z "${CURRENT_SHA}" > "${changed_files}"
          else
            git diff --name-only --no-renames --diff-filter=A -z "${PUSH_BEFORE_SHA}..${CURRENT_SHA}" > "${changed_files}"
          fi

          npm run --silent release:validate -- --changed-content --null < "${changed_files}"

  required:
    name: Required checks
    needs:
      - changes
      - frontend
      - manager-server
      - runtime-supervisor
      - runtime-supervisor-windows
      - ingress
      - manager-server-windows-sqlite
      - native-control
      - docker-build
      - demo-docs
      - release-content
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify applicable checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MANAGER_SERVER_RESULT: ${{ needs['manager-server'].result }}
          RUNTIME_SUPERVISOR_RESULT: ${{ needs['runtime-supervisor'].result }}
          RUNTIME_SUPERVISOR_WINDOWS_RESULT: ${{ needs['runtime-supervisor-windows'].result }}
          INGRESS_RESULT: ${{ needs.ingress.result }}
          WINDOWS_SQLITE_RESULT: ${{ needs['manager-server-windows-sqlite'].result }}
          NATIVE_CONTROL_RESULT: ${{ needs['native-control'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
          DEMO_DOCS_RESULT: ${{ needs['demo-docs'].result }}
          RELEASE_CONTENT_RESULT: ${{ needs['release-content'].result }}
        shell: bash
        run: |
          set -euo pipefail

          results=(
            "Scope:${CHANGES_RESULT}"
            "Frontend:${FRONTEND_RESULT}"
            "Manager Server:${MANAGER_SERVER_RESULT}"
            "Runtime Supervisor:${RUNTIME_SUPERVISOR_RESULT}"
            "Runtime Supervisor (Windows):${RUNTIME_SUPERVISOR_WINDOWS_RESULT}"
            "Ingress:${INGRESS_RESULT}"
            "Manager Server SQLite (Windows):${WINDOWS_SQLITE_RESULT}"
            "Native Control:${NATIVE_CONTROL_RESULT}"
            "Docker Build:${DOCKER_BUILD_RESULT}"
            "Demo and Docs:${DEMO_DOCS_RESULT}"
            "Release Content:${RELEASE_CONTENT_RESULT}"
          )

          for check in "${results[@]}"; do
            name="${check%%:*}"
            result="${check#*:}"
            case "${result}" in
              success|skipped)
                echo "${name}: ${result}"
                ;;
              *)
                echo "${name} did not complete successfully: ${result:-missing}" >&2
                exit 1
                ;;
            esac
          done
